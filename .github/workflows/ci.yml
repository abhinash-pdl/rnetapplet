name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: install build dependencies
        run: >
          pacman -Syu --noconfirm --needed base-devel git rust gtk4
          gtk4-layer-shell clang pkgconf linux-api-headers v4l-utils
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --features popup -- -D warnings
      - run: cargo test --locked --features popup
      - run: cargo clippy --bin rnetapplet --locked -- -D warnings
      - run: cargo test --bin rnetapplet --locked

  check-arm:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git \
            pkg-config clang libgtk-4-dev libwayland-dev wayland-protocols \
            meson ninja-build v4l-utils libgirepository1.0-dev
      - name: build gtk4-layer-shell from source
        run: |
          git clone --depth 1 --branch v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/usr --buildtype=release \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dintrospection=false -Dvapi=false
          ninja -C /tmp/gtk4-layer-shell/build
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --features popup -- -D warnings
      - run: cargo test --locked --features popup
      - run: cargo clippy --bin rnetapplet --locked -- -D warnings
      - run: cargo test --bin rnetapplet --locked

  version:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main'
       || github.event_name == 'workflow_dispatch')
      && !contains(github.event.head_commit.message || '', 'skip ci')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      bump: ${{ steps.ver.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

  build-x86:
    needs: [check, version]
    if: needs.version.outputs.bump == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: install build dependencies
        run: >
          pacman -Syu --noconfirm --needed base-devel git rust gtk4
          gtk4-layer-shell clang pkgconf linux-api-headers v4l-utils
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
      - name: build release
        run: |
          cargo build --release --locked --bin rnetapplet
          cargo build --release --locked --features popup --bin rnetapplet-popup
      - name: package tarball
        run: |
          VER="${{ needs.version.outputs.version }}"
          DIR="rnetapplet-$VER-x86_64-linux"
          rm -rf "$DIR" "$DIR.tar.gz" "$DIR.tar.gz.sha256"
          mkdir "$DIR"
          install -Dm755 target/release/rnetapplet "$DIR/rnetapplet"
          install -Dm755 target/release/rnetapplet-popup "$DIR/rnetapplet-popup"
          install -Dm644 packaging/rnetapplet.desktop "$DIR/rnetapplet.desktop"
          install -Dm644 packaging/rnetapplet.service "$DIR/rnetapplet.service"
          install -Dm644 README.md "$DIR/README.md"
          install -Dm644 LICENSE-MIT "$DIR/LICENSE-MIT"
          tar czf "$DIR.tar.gz" "$DIR"
          (cd "$(dirname "$DIR.tar.gz")" && sha256sum "$(basename "$DIR.tar.gz")" > "$(basename "$DIR.tar.gz").sha256")
          cat "$DIR.tar.gz.sha256"
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64
          path: rnetapplet-*-x86_64-linux.tar.gz*

  build-arm:
    needs: [check-arm, version]
    if: needs.version.outputs.bump == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git \
            pkg-config clang libgtk-4-dev libwayland-dev wayland-protocols \
            meson ninja-build v4l-utils libgirepository1.0-dev
      - name: build gtk4-layer-shell from source
        run: |
          git clone --depth 1 --branch v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/usr --buildtype=release \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dintrospection=false -Dvapi=false
          ninja -C /tmp/gtk4-layer-shell/build
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build release
        run: |
          cargo build --release --locked --bin rnetapplet
          cargo build --release --locked --features popup --bin rnetapplet-popup
      - name: package tarball
        run: |
          VER="${{ needs.version.outputs.version }}"
          DIR="rnetapplet-$VER-aarch64-linux"
          rm -rf "$DIR" "$DIR.tar.gz" "$DIR.tar.gz.sha256"
          mkdir "$DIR"
          install -Dm755 target/release/rnetapplet "$DIR/rnetapplet"
          install -Dm755 target/release/rnetapplet-popup "$DIR/rnetapplet-popup"
          install -Dm644 packaging/rnetapplet.desktop "$DIR/rnetapplet.desktop"
          install -Dm644 packaging/rnetapplet.service "$DIR/rnetapplet.service"
          install -Dm644 README.md "$DIR/README.md"
          install -Dm644 LICENSE-MIT "$DIR/LICENSE-MIT"
          tar czf "$DIR.tar.gz" "$DIR"
          (cd "$(dirname "$DIR.tar.gz")" && sha256sum "$(basename "$DIR.tar.gz")" > "$(basename "$DIR.tar.gz").sha256")
          cat "$DIR.tar.gz.sha256"
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-aarch64
          path: rnetapplet-*-aarch64-linux.tar.gz*

  publish:
    needs: [version, build-x86, build-arm]
    if: needs.version.outputs.bump == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: rnetapplet ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: rnetapplet-*.tar.gz*
      - name: point install script at the new release
        run: |
          set -eu
          VER="${{ needs.version.outputs.version }}"
          SHA=$(cut -d' ' -f1 "rnetapplet-$VER-x86_64-linux.tar.gz.sha256")
          python3 packaging/bump_readme.py "$VER" "$SHA"
          git diff --stat README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: point install script at v$VER [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main