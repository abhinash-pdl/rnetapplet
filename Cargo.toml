[package]
name = "rnetapplet"
version = "1.0.1"
edition = "2024"
rust-version = "1.92"
description = "Native Rust NetworkManager tray applet for wlroots Wayland compositors"
license = "MIT"
repository = "https://github.com/abhinash-pdl/rnetapplet"
homepage = "https://github.com/abhinash-pdl/rnetapplet"
keywords = ["networkmanager", "wayland", "tray", "wifi"]
categories = ["os::linux-apis"]

[[bin]]
name = "rnetapplet"
path = "src/main.rs"

[[bin]]
name = "rnetapplet-popup"
path = "src/bin/rnetapplet-popup.rs"
required-features = ["popup"]

[features]
default = []
popup = [
    "dep:gtk4",
    "dep:gtk4-layer-shell",
    "dep:glib",
    "dep:gio",
    "dep:image",
    "dep:rqrr",
    "dep:nokhwa",
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "signal", "process", "io-util"] }
async-channel = "2"
anyhow = "1"
libc = "0.2"
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", features = ["tokio"] }
rusty_network_manager = "0.7"
ksni = "0.3"
gtk4 = { version = "0.11", features = ["v4_10"], optional = true }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"], optional = true }
glib = { version = "0.22", optional = true }
gio = { version = "0.22", optional = true }
futures-core = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
rqrr = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
nokhwa = { version = "0.10", default-features = false, features = ["input-v4l"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
qrcode = "0.14"
